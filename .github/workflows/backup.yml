name: Minecraft Backup to Google Drive

# Runs daily at 18:00 UTC (~02:00 Beijing next day). Can also be run manually.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

env:
  PANEL_URL: https://panel.rainbowc.cn
  SERVER_ID: "7c352519"
  GDRIVE_DIR: "gdrive:mc-backups"
  KEEP: "100"
  PANEL_KEEP: "2"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install rclone
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o rclone.zip
          unzip -q rclone.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone
          rclone version

      - name: Write rclone config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF_B64 }}" | base64 -d > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Resolve SFTP endpoint from panel (survives node migrations)
        env:
          KEY: ${{ secrets.PTERO_API_KEY }}
        run: |
          DETAILS=$(curl -sL "$PANEL_URL/api/client/servers/$SERVER_ID" \
            -H "Authorization: Bearer $KEY" -H "Accept: application/json")
          SFTP_HOST=$(echo "$DETAILS" | python3 -c "import sys,json; d=json.load(sys.stdin)['attributes']['sftp_details']; print(d.get('domain') or d['ip'])")
          SFTP_PORT=$(echo "$DETAILS" | python3 -c "import sys,json; print(json.load(sys.stdin)['attributes']['sftp_details']['port'])")
          echo "SFTP endpoint: $SFTP_HOST:$SFTP_PORT"
          echo "SFTP_HOST=$SFTP_HOST" >> "$GITHUB_ENV"
          echo "SFTP_PORT=$SFTP_PORT" >> "$GITHUB_ENV"

      - name: Check SFTP auth (fail fast with a clear message)
        run: |
          if ! rclone lsd mcserver: --sftp-host "$SFTP_HOST" --sftp-port "$SFTP_PORT" \
              --contimeout 30s --timeout 60s --low-level-retries 2 --retries 1 > /dev/null 2>&1; then
            echo "::error::SFTP auth failed at $SFTP_HOST:$SFTP_PORT. The panel password stored in RCLONE_CONF_B64 is stale - regenerate the secret with the current panel password."
            exit 1
          fi
          echo "SFTP auth OK"

      - name: Pull server files via SFTP
        run: |
          mkdir -p srv
          set +e
          rclone copy mcserver: ./srv \
            --sftp-host "$SFTP_HOST" --sftp-port "$SFTP_PORT" \
            --contimeout 30s --timeout 120s --low-level-retries 3 --retries 1 \
            --transfers=8 --checkers=16 --ignore-errors \
            --exclude "cache/**" --exclude ".cache/**" --exclude "logs/**" \
            --exclude "plugins/spark/tmp/**" \
            --exclude "**/*.tmp" --exclude "**/*.jfr" \
            --exclude "**/*.partial" --exclude "**/session.lock" \
            --stats=30s --stats-one-line
          rc=$?
          set -e
          echo "rclone exit code: $rc (live server may skip a few volatile files, that's ok)"
          du -sh srv
          if [ ! -d srv/world ]; then echo "ERROR: world folder not pulled, aborting"; exit 1; fi

      - name: Zip
        id: zip
        run: |
          NAME="backup-$(date -u +%Y-%m-%d-%H%M).zip"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          zip -r -q "$NAME" srv
          ls -lh "$NAME"

      - name: Upload to Google Drive
        run: |
          rclone mkdir "${{ env.GDRIVE_DIR }}"
          rclone copyto "${{ steps.zip.outputs.name }}" "${{ env.GDRIVE_DIR }}/${{ steps.zip.outputs.name }}" --stats-one-line

      - name: Rotate Google Drive backups (keep newest N)
        run: |
          rclone lsf "${{ env.GDRIVE_DIR }}" --files-only \
            | grep -E '^backup-.*\.zip$' | sort \
            | head -n -${{ env.KEEP }} \
            | while read -r f; do
                echo "deleting old backup: $f"
                rclone delete "${{ env.GDRIVE_DIR }}/$f"
              done

      - name: Rotate panel node backups (free up the 3-slot limit)
        env:
          KEY: ${{ secrets.PTERO_API_KEY }}
          PANEL_KEEP: ${{ env.PANEL_KEEP }}
        run: |
          curl -sL "$PANEL_URL/api/client/servers/$SERVER_ID/backups" \
            -H "Authorization: Bearer $KEY" -H "Accept: application/json" \
          | python3 -c "
          import sys, json, subprocess, os
          d = json.load(sys.stdin)
          keep = int(os.environ['PANEL_KEEP'])
          bks = [b['attributes'] for b in d['data'] if b['attributes'].get('is_successful')]
          bks.sort(key=lambda x: x['created_at'])
          extra = bks[:-keep] if len(bks) > keep else []
          for b in extra:
              print('deleting panel backup:', b['name'])
              subprocess.run(['curl','-sL','-X','DELETE',
                f\"{os.environ['PANEL_URL']}/api/client/servers/{os.environ['SERVER_ID']}/backups/{b['uuid']}\",
                '-H', f\"Authorization: Bearer {os.environ['KEY']}\", '-H','Accept: application/json'])
          "
